name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write  # Required for OIDC token generation
  contents: write  # Required for commits
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skip for Dependabot PRs (already auto-approved)
    # Skip if not triggered by comment or PR
    if: |
      github.actor != 'dependabot[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && 
         github.event.issue.pull_request &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude'))
      )
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Use API key by default (more straightforward)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Trigger on @claude comments (agent mode)
          trigger_phrase: "@claude"
          # NOTE: label_trigger was removed - it could never fire. The action's
          # label trigger needs the `labeled` pull_request type, which this
          # workflow does not subscribe to (see `on:` above). See #3021.
          #
          # Read-only git inspection. The action's default tag-mode allowlist grants
          # only Bash(git add/commit/rm) + the push script, yet its own prompt tells
          # the agent "you have access to these git commands ... git status ... git diff
          # ... IMPORTANT: For PR diffs, use: git diff origin/develop...HEAD". Without
          # these the reviewer inspects the diff blind and logs permission denials (#3021).
          # --allowedTools is ADDITIVE to the action's defaults.
          #
          # Deliberately NOT granted:
          #   WebFetch / WebSearch - disabled upstream "by default for security";
          #     issue_comment runs in base-repo context with secrets, so granting
          #     network access opens an exfiltration path from untrusted PR content.
          #   Bash(mise exec:*) - `mise exec` runs arbitrary commands, which would be
          #     equivalent to unrestricted Bash.
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*)"
