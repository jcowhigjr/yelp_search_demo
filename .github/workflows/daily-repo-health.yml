# Daily repository health sweep (issue #2996 class of silent drift).
#
# Pure shell + gh CLI with the built-in GITHUB_TOKEN. No external API keys.
# Runs every morning and only speaks up when something is wrong:
#
#  1. Open PRs with auto-merge queued but branch BEHIND develop (stranded)
#  2. Dependabot PRs open for more than 24 hours
#  3. Latest Production Smoke Check run on develop failed
#  4. Latest Rails CI (main.yml) run on develop failed
#
# Findings go into a single deduplicated issue (titled "Daily repo health"):
# a comment is added if one is already open, otherwise a new issue is created.

name: 'Daily Repo Health'

on:
  schedule:
    - cron: "0 13 * * *"   # 09:00 ET daily
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

env:
  MARKER_TITLE: 'Daily repo health'
  REPO: ${{ github.repository }}

jobs:
  health-check:
    name: Sweep for silent drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Gather findings
        id: findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          bash scripts/daily-repo-health-findings.sh > /tmp/daily-health-findings.md

          if [ -s /tmp/daily-health-findings.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Findings detected:"
            cat /tmp/daily-health-findings.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected. Silent success."
          fi

      - name: Create or update tracking issue
        if: steps.findings.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ISSUE_NUMBER=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"${MARKER_TITLE}\"" --limit 1 \
            --json number --jq '.[0].number // ""')

          BODY_FILE=$(mktemp)
          {
            echo "## Daily repo health findings ($(date -u +%Y-%m-%d))"
            echo ""
            cat /tmp/daily-health-findings.md
            echo "---"
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > "$BODY_FILE"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$BODY_FILE"
            echo "Commented on existing issue #$ISSUE_NUMBER"
          else
            gh issue create --repo "$REPO" \
              --title "${MARKER_TITLE}: drift detected $(date -u +%Y-%m-%d)" \
              --body-file "$BODY_FILE"
            echo "Created new tracking issue"
          fi
