name: Queue safe Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  queue-safe-update:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Queue safe update for auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            steps.metadata.outputs.dependency-type == 'development'
          )
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Queueing safe Dependabot PR #$PR_NUMBER for auto-merge"
          gh pr merge --auto --squash "$PR_NUMBER"

      - name: Flag updates outside the automatic policy
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          !(
            steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            steps.metadata.outputs.dependency-type == 'development'
          )
        uses: actions/github-script@v9
        env:
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        with:
          script: |
            const marker = '<!-- dependabot-manual-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            if (comments.some((comment) => comment.body?.includes(marker))) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}
            This Dependabot update remains manual by policy.

            - Update type: \`${process.env.UPDATE_TYPE || 'unknown'}\`
            - Dependency type: \`${process.env.DEPENDENCY_TYPE || 'unknown'}\`

            Automatic merging is limited to patch updates and development-only minor updates.`,
            });
