name: Auto-update PRs

on:
  push:
    branches:
      - develop  # Update PRs when develop branch is updated

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags
      
      - name: Update PR branches that are behind develop
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing PRs targeting develop that are behind..."

          mapfile -t PRS < <(gh pr list \
            --base develop \
            --state open \
            --json number,isCrossRepository,headRefName,headRefOid,mergeStateStatus,autoMergeRequest \
            --jq '.[] |
              select(.isCrossRepository == false and .mergeStateStatus == "BEHIND") |
              [
                .number,
                .headRefName,
                .headRefOid,
                (.autoMergeRequest != null)
              ] |
              @tsv')

          if [[ ${#PRS[@]} -eq 0 ]]; then
            echo "No open PRs behind develop."
            exit 0
          fi

          echo "PRs to update: ${PRS[*]}"
          for PR_DATA in "${PRS[@]}"; do
            IFS=$'\t' read -r PR HEAD_BRANCH HEAD_SHA RESTORE_AUTO_MERGE <<< "$PR_DATA"
            echo "Updating branch on PR #${PR}"

            gh api \
              -X PUT \
              "repos/${{ github.repository }}/pulls/${PR}/update-branch" \
              -f expected_head_sha="$HEAD_SHA"

            UPDATED_HEAD_SHA="$HEAD_SHA"
            for _ in {1..12}; do
              sleep 5
              UPDATED_HEAD_SHA=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')
              if [[ "$UPDATED_HEAD_SHA" != "$HEAD_SHA" ]]; then
                break
              fi
            done

            if [[ "$UPDATED_HEAD_SHA" == "$HEAD_SHA" ]]; then
              echo "PR #${PR} did not receive an updated head commit within 60 seconds."
              exit 1
            fi

            if [[ "$RESTORE_AUTO_MERGE" == "true" ]]; then
              echo "Restoring the existing auto-merge request on PR #${PR}"
              gh pr merge --auto --squash "$PR"
            fi

            echo "Triggering CI workflow for PR #${PR} (branch: ${HEAD_BRANCH})"
            gh workflow run main.yml \
              --ref "${HEAD_BRANCH}" \
              --field triggered_by="auto-update-prs" \
              --field pr_number="${PR}"
          done
          echo "Done."
